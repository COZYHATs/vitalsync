<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documents · VitalSync</title>
    <link rel="stylesheet" href="css/global.css">
  </head>
  <body>
    <header>
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">V</div>
          <span>VitalSync</span>
        </div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="documents.html">Documents</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="page-header">
        <h1>Documents</h1>
        <p>Upload patient files and review their status within the secure workflow.</p>
      </div>

      <div class="card">
        <form id="upload">
          <div class="drop">
            <strong>Upload a patient file</strong>
            Drag & drop or choose a PDF, JPG, JPEG, or PNG
            <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required>
          </div>
          <button type="submit">Upload document</button>
          <p id="message"></p>
        </form>
      </div>

      <div class="card" style="margin-top:1.5rem;">
        <div class="card-header">
          <h2>Uploaded documents</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Size</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/documents.js"></script>
  </body>
</html>
